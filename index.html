<style>

/* ---------- 麻將牌面雪碧圖樣式 (9欄 x 5列) ---------- */
.t{

  height:48px;

<body>
<div id="app"></div>
<script>
const NM='東南西北', ZN='中發白';
const TILE_NAMES = [
  '一萬','二萬','三萬','四萬','五萬','六萬','七萬','八萬','九萬',
  '一筒','二筒','三筒','四筒','五筒','六筒','七筒','八筒','九筒',
  '一條','二條','三條','四條','五條','六條','七條','八條','九條',
  '東風','南風','西風','北風','紅中','青發','白板',
  '春','夏','秋','冬','梅','蘭','竹','菊'
];

/* ---------- 雪碧圖網格座標映射 [row(0~4), col(0~8)] ---------- */
const tileMap = {
  '-1': [3, 7],
  '0': [2, 0], '1': [2, 1], '2': [2, 2], '3': [2, 3], '4': [2, 4], '5': [2, 5], '6': [2, 6], '7': [2, 7], '8': [2, 8],
  '9': [0, 0], '10': [0, 1], '11': [0, 2], '12': [0, 3], '13': [0, 4], '14': [0, 5], '15': [0, 6], '16': [0, 7], '17': [0, 8],
  '18': [1, 0], '19': [1, 1], '20': [1, 2], '21': [1, 3], '22': [1, 4], '23': [1, 5], '24': [1, 6], '25': [1, 7], '26': [1, 8],
  '27': [3, 0], '28': [3, 1], '29': [3, 2], '30': [3, 3],
  '31': [3, 4], '32': [3, 5], '33': [3, 6],
  '34': [4, 0], '35': [4, 1], '36': [4, 2], '37': [4, 3],
  '38': [4, 4], '39': [4, 5], '40': [4, 7], '41': [4, 6]
};

const h=(t,c,x,k)=>{
  const e=document.createElement(t);
  if(c)e.className=c;
  if(x!=null)e.textContent=x;
  (k||[]).forEach(y=>e.append(y));
  return e;
};
const app=document.getElementById('app');

let peer=null,conns={},hostConn=null,myP=null,name='',code='',host=false,S=null,G=null,timer=null,sel=null,msg='',connecting=false,offlineMode=false;

/* ---------- 內建 Canvas 麻將牌面繪製 ---------- */
let spriteUrl = '';
(function generateTileAtlas(){
  const c = document.createElement('canvas');
  c.width = 900; c.height = 650;
  const ctx = c.getContext('2d');
  const cw = 100, ch = 130;

  const drawTileBase = (r, col, isBack=false) => {
    const x = col*cw + 3, y = r*ch + 3, w = cw - 6, h = ch - 6;
    ctx.fillStyle = isBack ? '#f59e0b' : '#fdfcf8';
    ctx.strokeStyle = '#cbd5e1';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 12);
    ctx.fill();
    ctx.stroke();
  };

  const drawText = (r, col, topTxt, botTxt, topCol, botCol, big=false) => {
    const cx = col*cw + cw/2, cy = r*ch + ch/2;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    if(big){
      ctx.fillStyle = topCol;
      ctx.font = 'bold 54px "Noto Serif TC", "KaiTi", serif';
      ctx.fillText(topTxt, cx, cy);
    } else {
      ctx.fillStyle = topCol;
      ctx.font = 'bold 40px "Noto Serif TC", "KaiTi", serif';
      ctx.fillText(topTxt, cx, cy - 24);
      ctx.fillStyle = botCol;
      ctx.font = 'bold 40px "Noto Serif TC", "KaiTi", serif';
      ctx.fillText(botTxt, cx, cy + 26);
    }
  };

  const drawDot = (x, y, rad, color) => {
    ctx.strokeStyle = color; ctx.fillStyle = color;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, rad*0.45, 0, Math.PI*2); ctx.fill();
  };

  // 第 0 列：筒子 (一筒 ~ 九筒)
  for(let col=0; col<9; col++){
    drawTileBase(0, col);
    const cx = col*cw+50, cy = 65, n = col+1;
    if(n===1){ drawDot(cx, cy, 28, '#1e40af'); drawDot(cx, cy, 18, '#dc2626'); }
    else if(n===2){ drawDot(cx, cy-26, 18, '#1e40af'); drawDot(cx, cy+26, 18, '#15803d'); }
    else if(n===3){ drawDot(cx-22, cy-32, 14, '#1e40af'); drawDot(cx, cy, 14, '#dc2626'); drawDot(cx+22, cy+32, 14, '#15803d'); }
    else if(n===4){ [[-20,-26,'#15803d'],[20,-26,'#1e40af'],[-20,26,'#1e40af'],[20,26,'#15803d']].forEach(p=>drawDot(cx+p[0],cy+p[1],14,p[2])); }
    else if(n===5){ [[-22,-30,'#15803d'],[22,-30,'#1e40af'],[0,0,'#dc2626'],[-22,30,'#1e40af'],[22,30,'#15803d']].forEach(p=>drawDot(cx+p[0],cy+p[1],13,p[2])); }
    else if(n===6){ [[-18,-32,'#15803d'],[18,-32,'#15803d'],[-18,4,'#dc2626'],[18,4,'#dc2626'],[-18,34,'#dc2626'],[18,34,'#dc2626']].forEach(p=>drawDot(cx+p[0],cy+p[1],12,p[2])); }
    else if(n===7){ [[-22,-38,'#15803d'],[0,-28,'#15803d'],[22,-18,'#15803d'],[-18,12,'#dc2626'],[18,12,'#dc2626'],[-18,38,'#dc2626'],[18,38,'#dc2626']].forEach(p=>drawDot(cx+p[0],cy+p[1],11,p[2])); }
    else if(n===8){ for(let r=0;r<4;r++)for(let k=0;k<2;k++)drawDot(cx+(k?18:-18), cy-36+r*24, 10, '#1e40af'); }
    else if(n===9){ for(let r=0;r<3;r++)for(let k=0;k<3;k++)drawDot(cx+(k-1)*24, cy+(r-1)*28, 10, r===0?'#1e40af':r===1?'#dc2626':'#15803d'); }
  }

  // 第 1 列：條子 (一條 ~ 九條)
  const drawStick = (x, y, h, color) => {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.roundRect(x-5, y-h/2, 10, h, 4); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(x-2, y-2, 4, 4);
  };
  for(let col=0; col<9; col++){
    drawTileBase(1, col);
    const cx = col*cw+50, cy = ch+65, n = col+1;
    if(n===1){ drawText(1, col, '🀐', '', '#15803d', '', true); }
    else if(n===2){ drawStick(cx, cy-22, 34, '#15803d'); drawStick(cx, cy+22, 34, '#15803d'); }
    else if(n===3){ drawStick(cx, cy-22, 34, '#15803d'); drawStick(cx-18, cy+22, 34, '#15803d'); drawStick(cx+18, cy+22, 34, '#15803d'); }
    else if(n===4){ [[-16,-22],[16,-22],[-16,22],[16,22]].forEach(p=>drawStick(cx+p[0],cy+p[1],34,'#15803d')); }
    else if(n===5){ [[-22,-22,'#15803d'],[22,-22,'#15803d'],[0,0,'#dc2626'],[-22,22,'#15803d'],[22,22,'#15803d']].forEach(p=>drawStick(cx+p[0],cy+p[1],32,p[2])); }
    else if(n===6){ [[-20,-22],[0,-22],[20,-22],[-20,22],[0,22],[20,22]].forEach(p=>drawStick(cx+p[0],cy+p[1],32,'#15803d')); }
    else if(n===7){ drawStick(cx, cy-32, 24, '#dc2626'); [[-20,0,'#15803d'],[0,0,'#1e40af'],[20,0,'#15803d'],[-20,30,'#15803d'],[0,30,'#1e40af'],[20,30,'#15803d']].forEach(p=>drawStick(cx+p[0],cy+p[1],24,p[2])); }
    else if(n===8){
      // 八條：上下對稱 W 與 M 竹節紋
      const draw8Part = (pts) => {
        ctx.strokeStyle = '#3d8b6b';
        ctx.lineWidth = 11.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        pts.forEach((p, idx) => idx === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1]));
        ctx.stroke();

        ctx.fillStyle = '#3d8b6b';
        pts.forEach((p, idx) => {
          if (idx < pts.length - 1) {
            const p2 = pts[idx + 1];
            [0.32, 0.68].forEach(t => {
              const mx = p[0] + (p2[0] - p[0]) * t;
              const my = p[1] + (p2[1] - p[1]) * t;
              ctx.beginPath();
              ctx.arc(mx, my, 5.2, 0, Math.PI * 2);
              ctx.fill();
            });
          }
        });

        ctx.strokeStyle = '#fdfcf8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        pts.forEach((p, idx) => idx === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1]));
        ctx.stroke();
      };

      draw8Part([
        [cx - 24, cy - 39],
        [cx - 24, cy - 11],
        [cx,      cy - 29],
        [cx + 24, cy - 11],
        [cx + 24, cy - 39]
      ]);

      draw8Part([
        [cx - 24, cy + 39],
        [cx - 24, cy + 11],
        [cx,      cy + 29],
        [cx + 24, cy + 11],
        [cx + 24, cy + 39]
      ]);
    }
    else if(n===9){ for(let r=0;r<3;r++)for(let k=0;k<3;k++)drawStick(cx+(k-1)*22, cy+(r-1)*30, 24, k===1?'#dc2626':'#15803d'); }
  }

  // 第 2 列：萬子 (一萬 ~ 九萬)
  const wanNums = ['一','二','三','四','五','六','七','八','九'];
  wanNums.forEach((w, col) => { drawTileBase(2, col); drawText(2, col, w, '萬', '#1e3a8a', '#dc2626'); });

  // 第 3 列：風牌、三元牌、牌背
  ['東','南','西','北'].forEach((w, col) => { drawTileBase(3, col); drawText(3, col, w, '', '#1e3a8a', '', true); });
  drawTileBase(3, 4); drawText(3, 4, '中', '', '#dc2626', '', true);
  drawTileBase(3, 5); drawText(3, 5, '發', '', '#15803d', '', true);
  drawTileBase(3, 6);
  ctx.strokeStyle = '#1e3a8a'; ctx.lineWidth = 4; ctx.strokeRect(6*cw+22, 3*ch+22, cw-44, ch-44);
  drawTileBase(3, 7, true);
  drawTileBase(3, 8, true);

  // 第 4 列：花牌
  const fls = [['1','春','#15803d','#dc2626'],['2','夏','#15803d','#dc2626'],['3','秋','#15803d','#dc2626'],['4','冬','#15803d','#dc2626'],
               ['梅','1','#1e3a8a','#dc2626'],['蘭','2','#1e3a8a','#dc2626'],['菊','3','#1e3a8a','#dc2626'],['竹','4','#1e3a8a','#dc2626']];
  fls.forEach((f, col) => { drawTileBase(4, col); drawText(4, col, f[0], f[1], f[2], f[3]); });
  drawTileBase(4, 8, true);

  spriteUrl = c.toDataURL('image/png');
  document.documentElement.style.setProperty('--tile-img', `url('${spriteUrl}')`);
})();

const urlParams = new URLSearchParams(window.location.search);
let presetCode = (urlParams.get('room') || '').trim().toUpperCase().slice(0, 5);

function send(a,o){
  const payload={type:'act',data:Object.assign({a},o||{})};
  if(host){
    if(G)act(0,payload.data);
  }else if(hostConn&&hostConn.open){
    hostConn.send(payload);
  }
}

function copyInviteLink(roomCode, btnEl){
  const url = new URL(window.location.href);
  url.searchParams.set('room', roomCode);
  const shareUrl = url.toString();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(shareUrl).then(()=>{
      const old = btnEl.textContent;
      btnEl.textContent = '✅ 已複製邀請連結！';
      setTimeout(()=>{ btnEl.textContent = old; }, 2000);
    }).catch(()=>fallbackCopy(shareUrl, btnEl));
  }else{
    fallbackCopy(shareUrl, btnEl);
  }
}

function fallbackCopy(text, btnEl){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{
    document.execCommand('copy');
    const old = btnEl.textContent;
    btnEl.textContent = '✅ 已複製邀請連結！';
    setTimeout(()=>{ btnEl.textContent = old; }, 2000);
  }catch(e){
    prompt('請手動複製以下邀請連結傳給朋友：', text);
  }
  document.body.removeChild(ta);
}

/* ---------- 牌與判胡 ---------- */
const cnt=a=>{const c=Array(34).fill(0);a.forEach(t=>c[t]++);return c};
function sets(c,pg,cg){
  let i=0;while(i<34&&!c[i])i++;if(i>=34)return true;
  if(pg&&c[i]>=3){c[i]-=3;const r=sets(c,pg,cg);c[i]+=3;if(r)return true}
  if(cg&&i<27&&i%9<7&&c[i+1]&&c[i+2]){c[i]--;c[i+1]--;c[i+2]--;const r=sets(c,pg,cg);c[i]++;c[i+1]++;c[i+2]++;if(r)return true}
  return false;
}
function win(a,pg=1,cg=1,pf=()=>1){
  if(a.length%3!==2)return false;
  const c=cnt(a);
  for(let i=0;i<34;i++)if(c[i]>=2&&pf(i)){c[i]-=2;const r=sets(c,pg,cg);c[i]+=2;if(r)return true}
  return false;
}
function tally(s,zm,extra){
  const hd=G.hands[s],ms=G.mel[s],w=(s-G.dealer+4)%4;let tai=0;const L=[],A=(n,x)=>{tai+=x;L.push(n+x+'台')};
  const all=[...hd,...ms.flatMap(m=>m.ts)],c=cnt(all);
  if(s===G.dealer){A('莊家',1);if(G.streak)A('連'+G.streak+'拉'+G.streak,2*G.streak)}
  if(ms.every(m=>m.k==='ag'))A('門清',1);
  if(zm)A('自摸',1);
  if(extra==='gang')A('槓上開花',1);
  if(extra==='rob')A('搶槓胡',1);
  G.fl[s].forEach(f=>{if(f%4===w)A('花牌',1)});
  [31,32,33].forEach(t=>{if(c[t]>=3)A(ZN[t-31],1)});
  if(c[27+w]>=3)A('門風',1);if(c[27]>=3)A('圈風',1);
  const su=new Set(all.filter(t=>t<27).map(t=>t/9|0)),ho=all.some(t=>t>=27);
  if(!su.size)A('字一色',16);else if(su.size===1)ho?A('混一色',4):A('清一色',8);
  if(!ms.some(m=>m.k==='chi')&&win(hd,1,0))A('碰碰胡',4);
  if(ms.every(m=>m.k==='chi')&&!G.fl[s].length&&win(hd,0,1,i=>i<27))A('平胡',2);
  return{tai,L};
}

/* ---------- 人機智慧評估工具 ---------- */
// 計算手牌的「進張潛力分數」（越多順子搭子、刻子、對子分數越高）
function evalHandScore(hd, seat){
  const c = cnt(hd);
  let score = 0;
  const windTile = 27 + (seat - G.dealer + 4) % 4;
  for(let i = 0; i < 34; i++){
    if(!c[i]) continue;
    const isHonor = i >= 27;
    const isValueHonor = i >= 31 || i === 27 || i === windTile;
    if(c[i] >= 3) score += isValueHonor ? 14 : 11;
    else if(c[i] === 2) score += isValueHonor ? 6 : 4.5;
    else if(isHonor) score -= 2.5; // 孤張字牌扣分
  }
  // 評估順子與兩面/嵌張搭子
  for(let suit = 0; suit < 3; suit++){
    const base = suit * 9;
    for(let n = 0; n < 9; n++){
      const t = base + n;
      if(!c[t]) continue;
      if(n <= 6 && c[t+1] && c[t+2]) score += 9; // 完整順子
      if(n <= 7 && c[t+1]) score += (n > 0 && n < 7) ? 3.5 : 2.2; // 兩面搭子優於邊張
      if(n <= 6 && c[t+2]) score += 2.0; // 嵌張搭子
    }
  }
  return score;
}

// 決定人機面對別家打牌時的吃、碰、槓、胡決策
function botDecideClaim(s, t, o){
  if(o.hu) return 'hu';
  const hd = G.hands[s];
  const windTile = 27 + (s - G.dealer + 4) % 4;
  const isValueHonor = t >= 31 || t === 27 || t === windTile;
  const baseScore = evalHandScore(hd, s);

  // 1. 評估明槓：手牌有3張相同，通常直接槓（除非會拆掉關鍵順子且手牌極好）
  if(o.gang){
    const afterGang = hd.filter(x => x !== t);
    if(evalHandScore(afterGang, s) >= baseScore - 14) return 'gang';
  }

  // 2. 評估碰牌：
  if(o.pon){
    // 中發白、圈風、門風，幾乎必碰（95% 機率）
    if(isValueHonor && Math.random() < 0.95) return 'pon';
    // 其他牌：比較碰牌後剩餘手牌的進張分數，若有提升或保持面子結構（且沒有拆掉完整順子）就碰
    const afterPon = hd.slice();
    for(let k = 0; k < 2; k++) afterPon.splice(afterPon.indexOf(t), 1);
    const newScore = evalHandScore(afterPon, s) + 11; // 加上桌面上已完成1組刻子的價值
    if(newScore >= baseScore - 1.0 && Math.random() < 0.85) return 'pon';
  }

  // 3. 評估吃牌（僅下家有 o.chi）：
  if(o.chi && o.chi.length){
    let bestChi = null;
    let bestScore = baseScore;
    for(const pair of o.chi){
      const afterChi = hd.slice();
      pair.forEach(v => afterChi.splice(afterChi.indexOf(v), 1));
      const newScore = evalHandScore(afterChi, s) + 9.5; // 加上桌面上已完成1組順子的價值
      // 只有吃牌能讓手牌整體結構變好（例如把孤張/嵌張變成完整面子），才執行吃牌
      if(newScore > bestScore + 0.5){
        bestScore = newScore;
        bestChi = pair;
      }
    }
    if(bestChi && Math.random() < 0.8) return bestChi;
  }

  return 'pass';
}

/* ---------- 房主引擎 ---------- */
const seatOf=p=>G.seats.findIndex(x=>x&&x.p===p);
function pub(){
  const H={},O={};
  G.seats.forEach((x,i)=>{if(x&&!x.b&&G.ph!=='lobby')H[i]=G.hands[i]});
  if(G.ph==='play'){
    if(G.mode==='c'||G.mode==='bg_c')G.wait.forEach(i=>O[i]=G.opts[i]);
    else if(!G.seats[G.turn].b){
      const hd=G.hands[G.turn],c=cnt(hd),ms=G.mel[G.turn];
      const bgList = G.drew && G.wall.length > 16
        ? [...new Set(ms.filter(m => m.k === 'pon' && hd.includes(m.ts[0])).map(m => m.ts[0]))]
        : [];
      O[G.turn]={
        hu: G.drew && win(hd) ? 1 : 0,
        ag: G.drew && G.wall.length > 16 ? [...new Set(hd.filter(t=>c[t]===4))] : [],
        bg: bgList
      };
    }
  }
  const b=G.ph==='lobby';
  const safeMel = G.mel.map((ms, idx) => ms.map(m => {
    if (m.k === 'ag' && G.ph !== 'end') {
      return { k: 'ag', ts: [-1, -1, -1, -1], realTs: m.ts };
    }
    return m;
  }));
  return{ph:G.ph,code,seats:G.seats,sc:G.sc,dealer:G.dealer,streak:G.streak,turn:G.turn,mode:G.mode,drew:G.drew,wl:b?0:G.wall.length,
    disc:G.disc,mel:safeMel,fl:G.fl,cnt:b?[]:G.hands.map(x=>x.length),last:G.last,wait:G.wait,res:G.res,shout:G.shout,H,O};
}

function bc(){
  if(!host||!G)return;
  const st=pub();
  S=st;
  Object.values(conns).forEach(c=>{
    if(c&&c.open){
      const pSeat = seatOf(c.peer);
      const customMel = st.mel.map((ms, idx) => idx === pSeat ? G.mel[idx] : ms);
      c.send({type:'st',data:Object.assign({}, st, {mel: customMel})});
    }
  });
  S = Object.assign({}, st, {mel: st.mel.map((ms, idx) => idx === 0 ? G.mel[0] : ms)});
  render();
}

function triggerShout(s, text){
  G.shout = { s, text, id: Date.now() + Math.random() };
  const sid = G.shout.id;
  setTimeout(()=>{
    if(G && G.shout && G.shout.id === sid){
      G.shout = null;
      bc();
    }
  }, 1800);
}

function start(){
  G.seats.forEach((x,i)=>{if(!x)G.seats[i]={n:'人機'+(i+1),p:'bot'+i,b:1}});
  newRound();
}

function newRound(){
  const w=[];
  for(let t=0;t<34;t++)for(let k=0;k<4;k++)w.push(t);
  for(let t=34;t<42;t++)w.push(t);
  for(let i=w.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[w[i],w[j]]=[w[j],w[i]]}
  Object.assign(G,{
    wall:w,hands:[[],[],[],[]],mel:[[],[],[],[]],fl:[[],[],[],[]],disc:[[],[],[],[]],
    last:null,res:null,wait:[],opts:{},claims:{},drew:false,fromGang:false,pendingBg:null,shout:null,
    passedHu:[false,false,false,false]
  });
  for(let r=0;r<16;r++)for(let s=0;s<4;s++)G.hands[s].push(G.wall.pop());
  for(let k=0;k<4;k++){
    const s=(G.dealer+k)%4;let hd=G.hands[s];
    while(hd.some(t=>t>=34)){
      const f=hd.filter(t=>t>=34);G.fl[s].push(...f);hd=hd.filter(t=>t<34);
      f.forEach(()=>hd.push(G.wall.shift()));G.hands[s]=hd;
    }
  }
  G.hands.forEach(a=>a.sort((x,y)=>x-y));
  G.ph='play';
  draw(G.dealer, false);
}

function pull(s){
  let t=G.wall.shift();
  while(t>=34){G.fl[s].push(t);t=G.wall.shift()}
  return t;
}

function draw(s, isFromGang=false){
  if(G.wall.length<=16)return fin(null);
  let t=G.wall.pop();
  while(t>=34){G.fl[s].push(t);t=G.wall.shift()}
  G.hands[s].push(t);
  G.turn=s;G.mode='d';G.drew=true;G.fromGang=isFromGang;
  G.passedHu[s]=false;
  sync();
}

function sync(){
  bc();
  if(G.ph!=='play'||G.mode!=='d')return;
  const s=G.turn,k=++G.tk;
  // 模擬真人思考時間（650ms ~ 1150ms）
  const delay = 650 + Math.floor(Math.random() * 500);
  if(G.seats[s].b)setTimeout(()=>{if(k===G.tk)bot(s)}, delay);
}

function bot(s){
  const hd=G.hands[s];
  // 1. 自摸胡牌
  if(G.drew&&win(hd)){
    triggerShout(s, '自摸！');
    return fin(s,1,G.fromGang?'gang':null);
  }
  // 2. 暗槓判斷（手牌有4張相同）
  if(G.drew && G.wall.length > 16){
    const c = cnt(hd);
    const agTile = hd.find(t => c[t] === 4);
    if(agTile != null){
      // 確認暗槓不會嚴重破壞順子結構才槓
      const withoutAg = hd.filter(t => t !== agTile);
      if(evalHandScore(withoutAg, s) >= evalHandScore(hd, s) - 15){
        return ag(s, agTile);
      }
    }
    // 3. 加槓判斷（已碰且摸到第4張）
    const ponMeld = G.mel[s].find(m => m.k === 'pon' && hd.includes(m.ts[0]));
    if(ponMeld) return initiateBg(s, ponMeld.ts[0]);
  }
  // 4. 捨牌判斷：評估打出每張牌後剩餘手牌的進張價值，保留最高分的手牌組合
  let bestTile = hd[0];
  let bestRemainScore = -1e9;
  const seen = new Set();
  for(let i = 0; i < hd.length; i++){
    const t = hd[i];
    if(seen.has(t)) continue;
    seen.add(t);
    const remain = hd.slice();
    remain.splice(i, 1);
    // 加上微量隨機擾動避免死板
    const sc = evalHandScore(remain, s) + (Math.random() * 0.6);
    if(sc > bestRemainScore){
      bestRemainScore = sc;
      bestTile = t;
    }
  }
  disc(s, bestTile);
}

function disc(s,t){
  const hd=G.hands[s],i=hd.indexOf(t);if(i<0)return;
  hd.splice(i,1);hd.sort((a,b)=>a-b);
  G.passedHu[s]=false;
  G.disc[s].push(t);G.last={t,f:s};G.mode='c';G.tk++;G.drew=false;G.fromGang=false;G.opts={};G.claims={};G.wait=[];
  let botHasClaim = false;
  for(let k=1;k<4;k++){
    const x=(s+k)%4,h2=G.hands[x],n=h2.filter(v=>v===t).length,o={};
    if(!G.passedHu[x] && win([...h2,t]))o.hu=1;
    if(n>=2)o.pon=1;
    if(k!==1 && n>=3 && G.wall.length>16)o.gang=1;
    if(k===1&&t<27){
      const q=t%9,has=v=>h2.includes(v),ch=[];
      if(q>=2&&has(t-2)&&has(t-1))ch.push([t-2,t-1]);
      if(q>=1&&q<=7&&has(t-1)&&has(t+1))ch.push([t-1,t+1]);
      if(q<=6&&has(t+1)&&has(t+2))ch.push([t+1,t+2]);
      if(ch.length)o.chi=ch;
    }
    if(Object.keys(o).length){
      G.opts[x]=o;
      if(G.seats[x].b){
        const decision = botDecideClaim(x, t, o);
        G.claims[x] = decision;
        if(decision !== 'pass') botHasClaim = true;
      } else {
        G.wait.push(x);
      }
    }
  }
  bc();
  if(!G.wait.length){
    // 若人機要吃/碰/槓/胡，稍微停頓 700ms 模擬真人反應喊牌
    setTimeout(resolve, botHasClaim ? 700 : 450);
  } else {
    timer=setTimeout(()=>{
      G.wait.forEach(x=>{
        if(G.opts[x]&&G.opts[x].hu)G.passedHu[x]=true;
        G.claims[x]='pass';
      });
      G.wait=[];resolve();
    },12000);
  }
}

function resolve(){
  clearTimeout(timer);
  if(G.mode!=='c'||G.ph!=='play')return;
  const d=G.last.f,t=G.last.t,ord=[1,2,3].map(k=>(d+k)%4),cl=G.claims;
  ord.forEach(s=>{if(G.opts[s]&&G.opts[s].hu&&cl[s]!=='hu')G.passedHu[s]=true});
  const hu=ord.find(s=>cl[s]==='hu');
  if(hu!=null){
    triggerShout(hu, '胡！');
    return fin(hu,0);
  }
  const pg=ord.find(s=>cl[s]==='pon'||cl[s]==='gang'),ch=ord.find(s=>Array.isArray(cl[s])),s=pg!=null?pg:ch;
  if(s==null)return draw((d+1)%4, false);
  const c=cl[s],hd=G.hands[s];G.disc[d].pop();let ts,k;
  if(Array.isArray(c)){
    k='chi';
    ts=[c[0], t, c[1]];
    triggerShout(s, '吃！');
  } else {
    k=c;
    ts=Array(c==='gang'?4:3).fill(t);
    triggerShout(s, c==='gang' ? '槓！' : '碰！');
  }
  const rm=ts.slice();rm.splice(rm.indexOf(t),1);rm.forEach(v=>hd.splice(hd.indexOf(v),1));
  G.mel[s].push({k,ts});G.turn=s;G.mode='d';G.last=null;
  G.passedHu[s]=false;
  if(k==='gang'){hd.push(pull(s));G.drew=true;G.fromGang=true}else{G.drew=false;G.fromGang=false}
  hd.sort((a,b)=>a-b);if(k==='gang')hd.push(hd.splice(hd.length-1,1)[0]);
  sync();
}

function ag(s,t){
  const hd=G.hands[s];
  G.hands[s]=hd.filter(x=>x!==t);
  G.mel[s].push({k:'ag',ts:[t,t,t,t]});
  G.hands[s].push(pull(s));
  G.fromGang=true;
  triggerShout(s, '暗槓！');
  sync();
}

/* ---------- 加槓與搶槓胡流程 ---------- */
function initiateBg(s, t){
  const hd=G.hands[s], idx=hd.indexOf(t);
  const m=G.mel[s].find(x=>x.k==='pon' && x.ts[0]===t);
  if(idx<0 || !m) return;

  G.mode='bg_c'; G.tk++; G.opts={}; G.claims={}; G.wait=[];
  G.pendingBg={s, t};
  G.last={t, f:s};
  triggerShout(s, '加槓！');

  for(let k=1;k<4;k++){
    const x=(s+k)%4, h2=G.hands[x];
    if(!G.passedHu[x] && win([...h2, t])){
      G.opts[x]={hu:1};
      if(G.seats[x].b) G.claims[x]='hu';
      else G.wait.push(x);
    }
  }
  bc();
  if(!G.wait.length) setTimeout(resolveBg, 450);
  else timer=setTimeout(()=>{
    G.wait.forEach(x=>{G.passedHu[x]=true; G.claims[x]='pass';});
    G.wait=[]; resolveBg();
  }, 10000);
}

function resolveBg(){
  clearTimeout(timer);
  if(G.mode!=='bg_c'||G.ph!=='play'||!G.pendingBg) return;
  const {s, t} = G.pendingBg;
  const ord=[1,2,3].map(k=>(s+k)%4), cl=G.claims;
  ord.forEach(x=>{if(G.opts[x]&&G.opts[x].hu&&cl[x]!=='hu')G.passedHu[x]=true});

  const hu=ord.find(x=>cl[x]==='hu');
  if(hu!=null){
    const hd=G.hands[s], idx=hd.indexOf(t);
    if(idx>=0) hd.splice(idx,1);
    G.pendingBg=null;
    triggerShout(hu, '搶槓胡！');
    return fin(hu, 0, 'rob');
  }

  const hd=G.hands[s], idx=hd.indexOf(t);
  const m=G.mel[s].find(x=>x.k==='pon' && x.ts[0]===t);
  if(idx>=0 && m){
    hd.splice(idx,1);
    m.k='bg';
    m.ts=[t,t,t,t];
    hd.push(pull(s));
  }
  G.pendingBg=null;
  G.last=null;
  G.mode='d';
  G.drew=true;
  G.fromGang=true;
  sync();
}

function fin(w,zm,extra){
  G.ph='end';G.tk++;clearTimeout(timer);G.wait=[];
  if(w==null)G.res={draw:1};
  else{
    let f=-1;
    if(!zm){
      f=G.last.f;
      G.hands[w].push(G.last.t);
      if(extra!=='rob') G.disc[f].pop();
    }
    const r=tally(w,zm,extra),a=3+r.tai;
    if(zm){for(let i=0;i<4;i++)if(i!==w){G.sc[i]-=a;G.sc[w]+=a}}
    else{G.sc[f]-=a;G.sc[w]+=a}
    G.res={w,zm,f,tai:r.tai,L:r.L,a,extra};
  }
  bc();
}

function act(s,d){
  const a=d.a;
  if(G.ph==='lobby'&&s===0){
    if(a==='bot'){const i=G.seats.findIndex(x=>!x);if(i>=0)G.seats[i]={n:'人機'+(i+1),p:'bot'+i,b:1};bc()}
    else if(a==='start')start();
    return;
  }
  if(G.ph==='end'&&s===0&&a==='next'){
    if(G.res.draw);
    else if(G.res.w===G.dealer)G.streak++;
    else{G.dealer=(G.dealer+1)%4;G.streak=0}
    newRound();
    return;
  }
  if(G.ph!=='play')return;
  if(G.mode==='d'&&G.turn===s){
    const hd=G.hands[s];
    if(a==='disc'&&hd.includes(d.t))disc(s,d.t);
    else if(a==='hu'&&G.drew&&win(hd))fin(s,1,G.fromGang?'gang':null);
    else if(a==='ag'&&G.drew&&G.wall.length>16&&hd.filter(x=>x===d.t).length===4)ag(s,d.t);
    else if(a==='bg'&&G.drew&&G.wall.length>16&&hd.includes(d.t)&&G.mel[s].some(m=>m.k==='pon'&&m.ts[0]===d.t))initiateBg(s,d.t);
  }else if(G.mode==='c'&&G.wait.includes(s)){
    const o=G.opts[s];let c=null;
    if(a==='pass')c='pass';
    else if((a==='hu'||a==='pon'||a==='gang')&&o[a])c=a;
    else if(a==='chi'&&o.chi&&o.chi[d.i])c=o.chi[d.i];
    if(c){G.claims[s]=c;G.wait=G.wait.filter(x=>x!==s);G.wait.length?bc():resolve()}
  }else if(G.mode==='bg_c'&&G.wait.includes(s)){
    const o=G.opts[s];let c=null;
    if(a==='pass')c='pass';
    else if(a==='hu'&&o.hu)c='hu';
    if(c){G.claims[s]=c;G.wait=G.wait.filter(x=>x!==s);G.wait.length?bc():resolveBg()}
  }
}

/* ---------- PeerJS 連線引擎 ---------- */
const ROOM_PREFIX = 'twmj-v1-';

function enter(c, asHost){
  const nm = document.getElementById('nm').value.trim().slice(0,8) || '玩家';
  name = nm; code = c; host = asHost; msg = ''; connecting = true; offlineMode = false;
  render();

  if(peer){ try{peer.destroy();}catch(e){} }
  const peerId = asHost ? (ROOM_PREFIX + c.toLowerCase()) : undefined;
  peer = new Peer(peerId, { debug: 1 });

  peer.on('open', id => {
    myP = id;
    if(asHost){
      connecting = false;
      const u = new URL(window.location.href);
      u.searchParams.set('room', c);
      window.history.replaceState({}, '', u);

      G = {
        ph:'lobby',
        seats:[{n:name, p:myP, b:0}, null, null, null],
        sc:[0,0,0,0], dealer:0, streak:0, tk:0,
        hands:[], wall:[], disc:[], mel:[], fl:[], wait:[], opts:{}, claims:{}
      };
      bc();
    } else {
      const conn = peer.connect(ROOM_PREFIX + c.toLowerCase(), { reliable: true });
      hostConn = conn;
      const timeout = setTimeout(()=>{
        if(!S){ msg='連線逾時：找不到此邀請碼，或房主尚未開啟房間。'; leave(true); }
      }, 8000);

      conn.on('open', ()=>{
        connecting = false;
        conn.send({type:'join', n:name});
      });
      conn.on('data', m => {
        if(m && m.type === 'st'){
          clearTimeout(timeout);
          S = m.data;
          render();
        }
      });
      conn.on('close', ()=>{
        msg = '與房主的連線已中斷。';
        leave(true);
      });
      conn.on('error', ()=>{
        clearTimeout(timeout);
        msg = '連線發生錯誤，請確認邀請碼是否正確。';
        leave(true);
      });
    }
  });

  if(asHost){
    peer.on('connection', conn => {
      conns[conn.peer] = conn;
      conn.on('data', m => {
        if(!G || !m) return;
        if(m.type === 'join'){
          if(G.ph !== 'lobby') return;
          if(seatOf(conn.peer) >= 0){ bc(); return; }
          let j = G.seats.findIndex(x => !x);
          if(j < 0) j = G.seats.findIndex(x => x && x.b);
          if(j >= 0){
            G.seats[j] = { n: String(m.n || '玩家').slice(0,8), p: conn.peer, b: 0 };
            bc();
          }
        } else if(m.type === 'act'){
          const s = seatOf(conn.peer);
          if(s >= 0 && m.data) act(s, m.data);
        }
      });
      conn.on('close', ()=>{
        delete conns[conn.peer];
        if(G && G.ph === 'lobby'){
          const s = seatOf(conn.peer);
          if(s > 0){ G.seats[s] = null; bc(); }
        }
      });
    });
  }

  peer.on('error', err => {
    connecting = false;
    if(err.type === 'unavailable-id'){
      msg = '房間代碼衝突，請再按一次建立房間。';
    } else if(err.type === 'peer-unavailable'){
      msg = '找不到該邀請碼的房間，請確認房主已建立房間。';
    } else {
      msg = '連線伺服器異常 (' + err.type + ')，請稍後再試。';
    }
    leave(true);
  });
}

function leave(keepMsg){
  try{ if(peer) peer.destroy(); }catch(e){}
  peer=null; conns={}; hostConn=null; S=null; G=null; myP=null; host=false; connecting=false; offlineMode=false;
  const u = new URL(window.location.href);
  u.searchParams.delete('room');
  window.history.replaceState({}, '', u);
  if(!keepMsg) msg='';
  render();
}

const mySeat=()=>S?S.seats.findIndex(x=>x&&x.p===myP):-1;

  if(presetCode){ cdInput.value = presetCode; }

  const demoCard = h('div','card',null,[
    h('div','row',null,[
      btn('⚡ 單機快速試玩（立即預覽麻將牌面）', ()=>startQuickDemo(), 'demo')
    ]),
    h('div','mini','免等待連線，立即開啟牌桌與 3 位智慧人機對戰。')
  ]);

  const joinCard = h('div','card',null,[
    h('div','mini', presetCode ? '🎯 已透過邀請連結自動帶入房間代碼：' : '已有邀請碼（多人連線）'),
    cdInput,
    h('div','row',null,[
      btn(presetCode ? '立即加入房間 (' + presetCode + ')' : '加入房間', ()=>{
        const c=document.getElementById('cd').value.trim().toUpperCase();
        if(c.length===5)enter(c,false);
      }, presetCode ? '' : 'g')
    ])
  ]);

  const createCard = h('div','card',null,[
    h('div','mini','建立新牌局（多人連線）'),
    h('div','row',null,[
      btn('建立房間',()=>enter(Array.from({length:5},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join(''),true), presetCode ? 'g' : '')
    ])
  ]);

  const nameCard = h('div','card',null,[
    h('div','mini','玩家暱稱'),
    nmInput
  ]);

  const atlasPreview = h('div','card',null,[
    h('b',0,'🀄 麻將牌面預覽（全部 42 張 + 牌背）'),
    h('div','mini','以下為內建繪製出的每一張牌面：'),
    h('div','atlas-box',null,[
      h('div','mini','筒子（一筒～九筒）：'),
      h('div','row',null,[9,10,11,12,13,14,15,16,17].map(t=>tz(t))),
      h('div','mini','條子（一條～九條）：'),
      h('div','row',null,[18,19,20,21,22,23,24,25,26].map(t=>tz(t))),
      h('div','mini','萬子（一萬～九萬）：'),
      h('div','row',null,[0,1,2,3,4,5,6,7,8].map(t=>tz(t))),
      h('div','mini','風牌、三元牌與牌背：'),
      h('div','row',null,[27,28,29,30,31,32,33,-1].map(t=>tz(t))),
      h('div','mini','花牌（春夏秋冬、梅蘭竹菊）：'),
      h('div','row',null,[34,35,36,37,38,39,40,41].map(t=>tz(t)))
    ])
  ]);

  app.replaceChildren(
    h('h1',0,'🀄 線上台灣麻將'),
    demoCard,
    nameCard,
    ...(presetCode ? [joinCard, createCard] : [createCard, joinCard]),
    atlasPreview,
    h('div','mini',msg||'')
  );
}

function btn(t,f,c){const b=h('button',c||'',t);b.onclick=()=>f(b);return b}

function render(){
  if(connecting) return app.replaceChildren(h('div','card','正在連線至對戰伺服器…'));
  if(!peer && !offlineMode) return draw0();
  if(!S) return app.replaceChildren(h('div','card','等待房間資料同步…'), btn('取消',()=>leave(false),'g'));
  const me=mySeat();
  if(me<0) return app.replaceChildren(h('div','card','房間已滿或遊戲已經開始，無法加入。'), btn('返回大廳',()=>leave(false),'g'));
  S.ph==='lobby'?lobby(me):table(me);
}

function lobby(me){
  const rows=S.seats.map((x,i)=>h('div','pl',(NM[i])+'位 '+(x?x.n+(x.b?'（人機）':i===me?'（你）':''):'空位')));
  const copyBtn = btn('📋 一鍵複製邀請連結', (b)=>copyInviteLink(S.code, b));
  app.replaceChildren(
    h('h1',0,'房間'),
    h('div','card',null,[
      h('div','mini','邀請碼（或直接複製下方連結傳給朋友）'),
      h('div','row',null,[h('div','code',S.code), copyBtn])
    ]),
    h('div','card',null,rows),
    host?h('div','row',null,[btn('加入人機',()=>send('bot'),'g'),btn('開始遊戲（空位自動補人機）',()=>send('start'))]):h('div','mini','等待房主開始…'),
    btn('離開',()=>leave(false),'g')
  );
}

/* ---------- 副露區渲染（暗槓對他人隱藏） ---------- */
function grp(ms, c, isOwner=false){
  return ms.map(m => {
    const isAg = m.k === 'ag';
    const showFace = isOwner || (S && S.ph === 'end') || !isAg;
    const tiles = showFace ? m.ts : [-1, -1, -1, -1];
    const extraCls = (isAg && isOwner && S && S.ph !== 'end') ? ' ag-self' : '';
    const grpEl = h('span', 'grp', null, tiles.map(t => tz(t, c + extraCls)));
    if (isAg && !showFace) grpEl.title = '暗槓（蓋牌隱藏）';
    else if (isAg && isOwner) grpEl.title = '你的暗槓（僅自己可見）';
    return grpEl;
  });
}

function card(i,me){
  const x=S.seats[i],w=NM[(i-S.dealer+4)%4];
  const titleRow = h('div',0,x.n+(i===S.dealer?' 莊':'')+(x.b?' 🤖':''));
  if(S.shout && S.shout.s === i){
    titleRow.append(h('span','shout',S.shout.text));
  }
  return h('div','pl'+(S.ph==='play'&&S.turn===i?' on':''),null,[
    titleRow,
    h('div','mini',w+'家 '+S.sc[i]+'分 手牌'+(S.cnt[i]||0)+'張'),
    h('div','hand',null,[...grp(S.mel[i],'sm', i===me),...S.fl[i].map(t=>tz(t,'sm')])
  ]);
}

function table(me){
  const o=[1,2,3].map(k=>(me+k)%4),
  pool=i=>h('div','pool',null,[
    h('b',0,S.seats[i].n+' 的牌河'),
    ...S.disc[i].map((t,j)=>tz(t,'sm'+(S.last&&S.last.f===i&&S.last.t===t&&j===S.disc[i].length-1?' hl':'')))
  ]);
  const hd=(S.H[me]||[]).slice(),turnMe=S.ph==='play'&&S.mode==='d'&&S.turn===me,opt=S.O[me]||{};
  let main=hd,last=null;
  if(turnMe&&S.drew){last=hd[hd.length-1];main=hd.slice(0,-1).sort((a,b)=>a-b)}
  else main=hd.slice().sort((a,b)=>a-b);

  const hs=[];
  const mk=(t,k)=>{
    const e=tz(t,sel===k?'up':'');
    e.onclick=()=>{
      if(!turnMe)return;
      if(sel===k){sel=null;send('disc',{t})}
      else{sel=k;render()}
    };
    return e;
  };
  main.forEach((t,i)=>hs.push(mk(t,'m'+i)));
  if(last!=null){hs.push(h('span','gap'));hs.push(mk(last,'L'))}

  const st=S.ph==='end'?'本局結束':S.mode==='d'?'輪到 '+S.seats[S.turn].n+' 打牌':S.mode==='bg_c'?'等待搶槓宣告…':'等待宣告：'+(S.wait.length?S.wait.map(i=>S.seats[i].n).join('、'):'…');
  const acts=[];
  if(S.ph==='play'&&(S.mode==='c'||S.mode==='bg_c')&&S.wait.includes(me)){
    const q=S.O[me]||{};
    if(q.hu)acts.push(btn(S.mode==='bg_c'?'搶槓胡':'胡',()=>send('hu'),'x'));
    if(S.mode==='c'){
      if(q.gang)acts.push(btn('槓',()=>send('gang')));
      if(q.pon)acts.push(btn('碰',()=>send('pon')));
      (q.chi||[]).forEach((c,i)=>acts.push(btn('吃 '+c.map(t=>tl(t).join('')).join(' '),()=>send('chi',{i}))));
    }
    acts.push(btn('過',()=>send('pass'),'g'));
  }
  if(turnMe){
    if(opt.hu)acts.push(btn('自摸',()=>send('hu'),'x'));
    (opt.ag||[]).forEach(t=>acts.push(btn('暗槓 '+tl(t).join(''),()=>send('ag',{t}))));
    (opt.bg||[]).forEach(t=>acts.push(btn('加槓 '+tl(t).join(''),()=>send('bg',{t}))));
  }

  const kids=[
    h('div','row',null,[
      h('span','mini',(offlineMode?'單機試玩模式':'邀請碼 '+S.code)+' 剩牌 '+S.wl+' '+NM[0]+'圈 連莊 '+S.streak),
      btn('離開',()=>leave(false),'g')
    ]),
    h('div','opp',null,o.map(i=>card(i,me))),
    h('div','felt',null,[pool(o[1]),pool(o[0]),pool(o[2]),pool(me)]),
    h('div','mini',st)
  ];

  if(S.ph==='end'){
    const r=S.res;
    kids.push(h('div','card res',null,r.draw?[h('b',0,'流局，莊家連莊')]:[
      h('b',0,S.seats[r.w].n+(r.zm?' 自摸！':r.extra==='rob'?' 搶槓胡！（'+S.seats[r.f].n+' 被搶槓）':' 胡牌！（'+S.seats[r.f].n+' 放槍）')),
      h('div',0,r.L.join('、')||'無台'),
      h('div',0,'共 '+r.tai+' 台，每家賠 '+r.a+' 分'),
      (() => {
    const rTiles = [...(S.H[r.w] || [])].sort((a,b)=>a-b);
    let winTile = null;
    if(r.w != null && S.last && S.last.t != null && !r.zm){
      // 放槍或搶槓胡：將胡的那一張牌從手牌中抽出來單獨顯示
      const idx = rTiles.indexOf(S.last.t);
      if(idx >= 0) {
        winTile = rTiles.splice(idx, 1)[0];
      }
    } else if(r.w != null && r.zm && rTiles.length % 3 === 2) {
      // 自摸：摸進的最後一張牌即為自摸牌，抽出來單獨顯示
      winTile = rTiles.pop();
    }
    const handEls = rTiles.map(t => tz(t, 'sm'));
    const kidsArr = [...grp(S.mel[r.w] || [], 'sm', true), ...handEls];
    if(winTile != null) {
      kidsArr.push(h('span', 'gap'));
      kidsArr.push(tz(winTile, 'sm hl'));
    }
    return h('div', 'hand', null, kidsArr);
  })()
    ]));
    kids.push(host?btn('下一局',()=>send('next')):h('div','mini','等待房主開始下一局'));
  }

  kids.push(h('div','card',null,[
    h('div','row',null,[
      h('b',0,S.seats[me].n+'（你）'+NM[(me-S.dealer+4)%4]+'家 '+S.sc[me]+'分'),
      ...S.fl[me].map(t=>tz(t,'sm'))
    ]),
    h('div','hand',null,[...grp(S.mel[me],'',true),...hs]),
    h('div','row',null,acts),
    turnMe?h('div','mini','點一張牌選取（牌會浮起），再點一次打出'):null
  ].filter(Boolean)));

  app.replaceChildren(...kids);
}

draw0();
</script>
</body>
</html>
